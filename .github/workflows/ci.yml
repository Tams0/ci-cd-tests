name: Ma première CI/CD

on:
  push:
    branches: [main]
    tags:
     - git tag -a v1.0 -m "Mon message de version"

jobs:
  build:
    # On utilise l'Ubuntu latest pour la build
    runs-on: ubuntu-latest

    steps:
      # On récupère le code via le git
      - uses: actions/checkout@v3
      # On utilise/install Node.js 20.x
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'
      # On installe les dépendances
      - run: npm ci
      # On lance le linter
      - run: npm run lint
      # On lance les tests
      - run: npm test
      #SCA
      - name: SCA - Audit des dépendances
        run: npm audit --audit-level=high
      #SAST
      - name: SAST - Scan du code source (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript
      #Notification discord
      - name: Notify Discord on failure
  if: failure()
  run: |
    curl -H "Content-Type: application/json" \
    -X POST \
    -d '{
      "username": "CI/CD Bot",
      "embeds": [{
        "title": "❌ Pipeline échouée",
        "description": "Le scan de sécurité a détecté une vulnérabilité",
        "color": 16711680,
        "fields": [
          { "name": "Repository", "value": "${{ github.repository }}", "inline": true },
          { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
          { "name": "Commit", "value": "${{ github.sha }}", "inline": false },
          { "name": "Auteur", "value": "${{ github.actor }}", "inline": true }
        ],
        "footer": { "text": "GitHub Actions" }
      }]
    }' \
    ${{ secrets.DISCORD_WEBHOOK }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: ttskch/render-deploy@v1.0.0
        with:
          api-key: ${{ secrets.API_KEY }}
          service-id: ${{ secrets.SECRET_KEY }}
          discord-webhook : ${{ secrets.DISCORD_WEBHOOK }}
      

